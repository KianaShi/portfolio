<!-- Accessible equivalent of the 3D phone music player (src/player/phone-player.js).
     Visually hidden (not display:none, so it stays reachable by Tab and screen readers)
     but drives the exact same playback state as clicking the phone in the 3D scene. -->
<div class="sr-only" aria-label="Music player">
  <div id="ppNowPlaying" aria-live="polite"></div>
  <button id="ppPrev" type="button" aria-label="Previous track">Previous track</button>
  <button id="ppPlayPause" type="button" aria-label="Play">Play</button>
  <button id="ppNext" type="button" aria-label="Next track">Next track</button>
  <label for="ppSeek">Seek</label>
  <input id="ppSeek" type="range" min="0" max="1000" value="0" aria-label="Seek track position">
</div>
